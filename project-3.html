
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проект № 1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      color: #222;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .container {
      width: min(100% - 40px, 1000px);
      margin: 0 auto;
    }

    header {
      padding: 28px 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .back-link {
      color: #666;
    }

    .intro {
      padding: 55px 0 35px;
    }

    .eyebrow {
      color: #777;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(36px, 7vw, 64px);
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    .description {
      max-width: 620px;
      color: #666;
      font-size: 18px;
    }

    
.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  padding: 20px 0 55px;
}

.gallery img {
  display: block;
  width: 100%;
  height: 280px;
  object-fit: cover;
  border-radius: 14px;
  background: #e8e8e5;
}

/* Первая фотография крупнее остальных */
.gallery img:first-child {
  grid-column: 1 / -1;
  height: 750px;
}


    .details {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 30px;
      padding: 35px 0 70px;
      border-top: 1px solid #ddd;
    }

    h2 {
      margin-top: 0;
      font-size: 25px;
    }

    .details p {
      color: #666;
    }

    .detail-card {
      padding: 20px;
      background: white;
      border-radius: 12px;
    }

    footer {
      padding: 25px 0;
      border-top: 1px solid #ddd;
      color: #777;
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      .gallery img,
      .gallery img:first-child {
        grid-column: auto;
        height: 260px;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="container">
    <a class="back-link" href="index.html">
      ← Назад ко всем проектам
    </a>
  </header>

  <main class="container">
    <section class="intro">
      <div class="eyebrow">Моё портфолио · Проекты мебели</div>
      <h1>Кухни, шкафы, гардеробные</h1>
      <p class="description">
        
      </p>
    </section>

    <section class="gallery">
 <img src="images/30.jpg" alt="Фотография 1">
  <img src="images/31.jpg" alt="Фотография 2">
  <img src="images/32.jpg" alt="Фотография 3">
  <img src="images/33.jpg" alt="Фотография 4">
  <img src="images/34.jpg" alt="Фотография 5">
  <img src="images/35.jpg" alt="Фотография 6">
  <img src="images/36.jpg" alt="Фотография 7">
  <img src="images/40.jpg" alt="Фотография 8">
</section>

    
  </main>

  <footer class="container">
    Моё портфолио · 2026
  </footer>
</body>
</html>
